name: CI V1
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend tests
      - run: pytest -q
  android-debug:
    runs-on: ubuntu-latest
    env:
      HERMES_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
      HERMES_KEYSTORE_PASSWORD: ${{ secrets.HERMES_KEYSTORE_PASSWORD }}
      HERMES_KEY_ALIAS: ${{ secrets.HERMES_KEY_ALIAS }}
      HERMES_KEY_PASSWORD: ${{ secrets.HERMES_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore (firma stabile per updater; se assente, debug-key default)
        shell: bash
        run: |
          if [ -n "${{ secrets.HERMES_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.HERMES_KEYSTORE_BASE64 }}" | base64 --decode > "$HERMES_KEYSTORE_PATH"
          else
            echo "HERMES_KEYSTORE_PATH=" >> "$GITHUB_ENV"
          fi
      - name: Generate wrapper if missing then build
        working-directory: android
        run: |
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --build-cache
      - name: Unit tests (JVM, no device)
        working-directory: android
        run: ./gradlew testDebugUnitTest --build-cache
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HermesStudio-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
